<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">AI Coding Studio</title><desc id="desc">A local-first developer workspace banner showing browser interface, repository context, guarded tools, approval, and verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16172c"/><stop offset="1" stop-color="#315d91"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 45px Segoe UI,Arial;fill:#f5f7ff}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.4px;fill:#d7e8fb}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#a5e6ff}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#bfd4e8}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1100" cy="20" r="230" fill="#a896ff" opacity=".12"/><text x="70" y="66" class="e">AI CODING STUDIO � LOCAL-FIRST � GOVERNED EXECUTION</text><text x="70" y="125" class="t">AI Coding Studio</text><text x="72" y="160" class="s">CONTEXT    TOOLS    APPROVAL    LOCAL BRIDGE    VERIFIED WORK</text><path d="M110 245H1090" stroke="#5b82b6" stroke-width="2"/><path d="M144 245H1050" stroke="#a5e6ff" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#2c416a" stroke="#a5e6ff" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Browser UI</text><text x="144" y="312" text-anchor="middle" class="q">Chrome � Firefox � Android</text><circle cx="383" cy="245" r="24" fill="#2c416a" stroke="#a5e6ff" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Context</text><text x="383" y="312" text-anchor="middle" class="q">repo ingestion</text><circle cx="622" cy="245" r="24" fill="#2c416a" stroke="#a5e6ff" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Tool registry</text><text x="622" y="312" text-anchor="middle" class="q">workflow contracts</text><circle cx="861" cy="245" r="24" fill="#2c416a" stroke="#a5e6ff" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="q">Approval policy</text><circle cx="1050" cy="245" r="24" fill="#514431" stroke="#f0c477" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Verify</text><text x="1050" y="312" text-anchor="middle" class="q">build � tests � evidence</text></g><text x="70" y="342" class="q">Model output stays outside the authority boundary � local capabilities remain explicit</text></svg>

