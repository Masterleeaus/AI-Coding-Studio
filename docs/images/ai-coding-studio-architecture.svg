<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">AI Coding Studio architecture</title><desc id="desc">A browser or Android interface sends repository context to a runtime kernel, workflow and tool registries, approval policy, authenticated local bridge, repository tools, and verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16172c"/><stop offset="1" stop-color="#315d91"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#a5e6ff"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#a5e6ff}.t{font:700 32px Segoe UI,Arial;fill:#f5f7ff}.s{font:400 15px Segoe UI,Arial;fill:#d7e8fb}.n{fill:#273962;stroke:#6388ba;stroke-width:2}.g{fill:#315d91;stroke:#a5e6ff;stroke-width:2}.y{fill:#514431;stroke:#f0c477;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#d5e4f3}.q{font:400 12px Segoe UI,Arial;fill:#bed2e6}.r{stroke:#a5e6ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">AI CODING STUDIO � SOURCE MAP</text><text x="64" y="106" class="t">Reasoning proposes; local contracts decide</text><text x="64" y="136" class="s">Source-backed from src/runtime, src/workflows, src/lib, src/platform, extension/, and tests/.</text><rect x="70" y="220" width="260" height="130" rx="16" class="n"/><text x="200" y="260" text-anchor="middle" class="l">Browser / Android UI</text><text x="200" y="290" text-anchor="middle" class="b">conversation + artifacts</text><text x="200" y="318" text-anchor="middle" class="q">extension + WebView target</text><path d="M330 285H440" class="r"/><rect x="440" y="220" width="260" height="130" rx="16" class="g"/><text x="570" y="260" text-anchor="middle" class="l">Context + Runtime Kernel</text><text x="570" y="290" text-anchor="middle" class="b">repo ingestion + contracts</text><text x="570" y="318" text-anchor="middle" class="q">src/runtime + src/lib</text><path d="M700 285H810" class="r"/><rect x="810" y="220" width="260" height="130" rx="16" class="g"/><text x="940" y="260" text-anchor="middle" class="l">Workflow + Tool Registry</text><text x="940" y="290" text-anchor="middle" class="b">structured execution</text><text x="940" y="318" text-anchor="middle" class="q">src/workflows + tools</text><path d="M1070 285H1180" class="r"/><rect x="1180" y="220" width="250" height="130" rx="16" class="y"/><text x="1305" y="260" text-anchor="middle" class="l">Approval Policy</text><text x="1305" y="290" text-anchor="middle" class="b">bounded local authority</text><text x="1305" y="318" text-anchor="middle" class="q">explicit approval gates</text><path d="M1305 350V500H980" class="r"/><rect x="700" y="520" width="560" height="92" rx="16" class="n"/><text x="980" y="557" text-anchor="middle" class="l">Authenticated Local Bridge</text><text x="980" y="584" text-anchor="middle" class="q">repository tools  build/test/verification  evidence back to UI</text></svg>

