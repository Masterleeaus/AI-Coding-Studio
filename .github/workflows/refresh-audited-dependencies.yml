name: Refresh Audited Dependencies

on:
  push:
    branches:
      - agent-3/workflows-tests-integration
    paths:
      - .github/workflows/refresh-audited-dependencies.yml

permissions:
  contents: write

concurrency:
  group: refresh-audited-dependencies
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh and verify dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current Agent 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent-3/workflows-tests-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Replace obsolete npm SheetJS package with maintained release
        run: npm install --save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Verify clean reproducible install
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high

      - name: Run contract and unit tests
        run: |
          npm run test:contracts
          npm run test:unit

      - name: Build Chrome and Firefox targets
        run: |
          npm run build:chrome
          unzip -t better-deepseek-chrome.zip
          npm run build:firefox
          unzip -t better-deepseek-firefox.zip

      - name: Remove one-shot workflow
        run: git rm .github/workflows/refresh-audited-dependencies.yml

      - name: Commit verified dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/refresh-audited-dependencies.yml
          git commit -m 'fix(deps): refresh audited build dependencies'
          git pull --rebase origin agent-3/workflows-tests-integration
          git push origin HEAD:agent-3/workflows-tests-integration
