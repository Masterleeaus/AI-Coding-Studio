name: Extension Verification

on:
  pull_request:
    branches:
      - main
      - integration/local-first-repair
  push:
    branches:
      - integration/local-first-repair
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SHEETJS_TARBALL: https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
  VITEST_VERSION: 4.1.10

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts-and-locales:
    name: Contracts and locales
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check locale parity
        run: npm run check-locales

      - name: Run shared workflow contract tests
        run: npm run test:contracts

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore

  browser-builds:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - chrome
          - firefox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension target
        run: npm run build:${{ matrix.target }}

      - name: Validate generated archive
        run: unzip -t better-deepseek-${{ matrix.target }}.zip

      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: better-deepseek-${{ matrix.target }}.zip
          if-no-files-found: error

  chrome-e2e:
    name: Chrome-target Chromium E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Chrome target
        run: npm run build:chrome

      - name: Run Chrome-target E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-report
          path: playwright-report/
          if-no-files-found: ignore

  firefox-e2e:
    name: Firefox E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build Firefox target
        run: npm run build:firefox

      - name: Run Firefox E2E tests
        env:
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: npm run test:e2e:firefox

      - name: Upload Firefox results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-test-results
          path: test-results-firefox/
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit and state export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate exact remediated dependency state
        run: |
          npm ci
          npm remove xlsx
          npm install --save-exact "$SHEETJS_TARBALL"
          npm install --save-dev --save-exact \
            "vitest@$VITEST_VERSION" \
            "@vitest/coverage-v8@$VITEST_VERSION" \
            "@vitest/ui@$VITEST_VERSION"
          npm audit fix || true
          rm -rf node_modules
          npm ci

      - name: Audit high-severity dependency issues
        run: npm audit --audit-level=high

      - name: Verify remediated unit and contract behavior
        run: |
          npm run check-locales
          npm run test:contracts
          npm run test:unit

      - name: Export verified dependency state
        uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-state
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3
