name: Dependency Remediation Verification

on:
  pull_request:
    branches:
      - agent-3/workflows-tests-integration

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SHEETJS_TARBALL: https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
  VITEST_VERSION: 4.1.10

jobs:
  finalize:
    name: Commit exact dependency state
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate exact dependency state
        run: |
          npm ci
          npm remove xlsx
          npm install --save-exact "$SHEETJS_TARBALL"
          npm install --save-dev --save-exact \
            "vitest@$VITEST_VERSION" \
            "@vitest/coverage-v8@$VITEST_VERSION" \
            "@vitest/ui@$VITEST_VERSION"
          npm audit fix || true
          rm -rf node_modules
          npm ci
          npm audit --audit-level=high
      - name: Verify committed dependency declarations
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = {
            xlsx: process.env.SHEETJS_TARBALL,
            vitest: process.env.VITEST_VERSION,
            '@vitest/coverage-v8': process.env.VITEST_VERSION,
            '@vitest/ui': process.env.VITEST_VERSION,
          };

          const actual = {
            xlsx: pkg.dependencies?.xlsx,
            vitest: pkg.devDependencies?.vitest,
            '@vitest/coverage-v8': pkg.devDependencies?.['@vitest/coverage-v8'],
            '@vitest/ui': pkg.devDependencies?.['@vitest/ui'],
          };

          for (const [name, version] of Object.entries(expected)) {
            if (actual[name] !== version) {
              throw new Error(`${name} must be pinned to ${version}; found ${actual[name]}`);
            }
          }
          NODE
      - name: Commit generated package files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency state is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): commit verified dependency state [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  shared:
    name: Audit, contracts, unit and XLSX round trip
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install committed dependency state
        run: npm ci
      - name: Enforce high-severity audit gate
        run: npm audit --audit-level=high
      - name: Verify locales, workflow contracts and unit suite
        run: |
          npm run check-locales
          npm run test:contracts
          npm run test:unit

  browsers:
    name: Chrome and Firefox builds and startup smoke
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install committed dependency state
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Chrome target
        run: |
          npm run build:chrome
          unzip -t better-deepseek-chrome.zip
          npm run test:e2e
      - name: Verify Firefox target
        env:
          FIREFOX_BIN: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: |
          npm run build:firefox
          unzip -t better-deepseek-firefox.zip
          npm run test:e2e:firefox

  android:
    name: Android WebView, APK and Gradle tests
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic
      - uses: android-actions/setup-android@v3
      - name: Install committed dependency state
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Android WebView target
        run: |
          npm run build:android
          npm run test:e2e:android
      - name: Record Android task graph
        working-directory: android
        run: gradle --no-daemon tasks --all --console=plain
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace --console=plain
      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon test --stacktrace --console=plain
