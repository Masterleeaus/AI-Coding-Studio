name: Diagnose Verified Dependency Candidate

on:
  push:
    branches:
      - agent-3/dependency-security-remediation
    paths:
      - .github/workflows/remediate-dependencies.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic
      - uses: android-actions/setup-android@v3
      - id: setup_firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - id: candidate
        continue-on-error: true
        run: |
          npm ci
          npm remove xlsx
          npm install --save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          npm install --save-dev vitest@4.1.10 @vitest/coverage-v8@4.1.10 @vitest/ui@4.1.10
          npm audit fix || true
          rm -rf node_modules
          npm ci

      - id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - id: shared
        continue-on-error: true
        run: |
          npm run check-locales
          npm run test:contracts
          npm run test:unit

      - id: playwright
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - id: chrome
        continue-on-error: true
        run: |
          npm run build:chrome
          unzip -t better-deepseek-chrome.zip
          npm run test:e2e

      - id: firefox
        continue-on-error: true
        env:
          FIREFOX_BIN: ${{ steps.setup_firefox.outputs.firefox-path }}
        run: |
          npm run build:firefox
          unzip -t better-deepseek-firefox.zip
          npm run test:e2e:firefox

      - id: android_web
        continue-on-error: true
        run: |
          npm run build:android
          npm run test:e2e:android

      - id: android_native
        continue-on-error: true
        run: |
          gradle -p android --no-daemon assembleDebug --stacktrace
          gradle -p android --no-daemon test --stacktrace

      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          SHARED: ${{ steps.shared.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          CHROME: ${{ steps.chrome.outcome }}
          FIREFOX: ${{ steps.firefox.outcome }}
          ANDROID_WEB: ${{ steps.android_web.outcome }}
          ANDROID_NATIVE: ${{ steps.android_native.outcome }}
        run: gh pr comment 8 --body "Full dependency candidate matrix — candidate: ${CANDIDATE}; audit: ${AUDIT}; shared: ${SHARED}; Playwright: ${PLAYWRIGHT}; Chrome: ${CHROME}; Firefox: ${FIREFOX}; Android WebView: ${ANDROID_WEB}; Android native: ${ANDROID_NATIVE}. This diagnostic made no repository content changes."
