name: Diagnose Audited Dependencies

on:
  push:
    branches:
      - agent-3/dependency-security-remediation
    paths:
      - .github/workflows/remediate-dependencies.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build remediation candidate in runner workspace
        run: |
          npm remove xlsx
          npm install --save https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          npm audit fix || true
          rm -rf node_modules
          npm ci

      - name: Capture audit report
        run: npm audit --json > /tmp/dependency-audit.json || true

      - name: Format audit summary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/dependency-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          const packages = Object.keys(report.vulnerabilities ?? {}).sort();
          const lines = [
            '## Dependency remediation diagnostic',
            '',
            'Candidate operations:',
            '- official SheetJS 0.20.3 CDN tarball',
            '- compatible `npm audit fix` updates',
            '- clean `npm ci` reinstall',
            '',
            'Residual vulnerability counts:',
            '```json',
            JSON.stringify(counts, null, 2),
            '```',
            '',
            `Residual packages: ${packages.length ? packages.map((name) => `\`${name}\``).join(', ') : 'none'}`,
            '',
            'No package or lockfile changes were committed by this diagnostic run.'
          ];
          writeFileSync('/tmp/dependency-audit-comment.md', `${lines.join('\n')}\n`);
          NODE

      - name: Post diagnostic to draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 8 --body-file /tmp/dependency-audit-comment.md
